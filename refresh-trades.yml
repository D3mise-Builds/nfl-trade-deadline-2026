name: Refresh confirmed NFL trades
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python sync_trades.py
      - name: Commit confirmed updates only
        run: |
          if git diff --quiet -- trades.json; then
            echo 'No new confirmed trades'
            exit 0
          fi
          git config user.name 'nfl-trade-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trades.json
          git commit -m 'Auto-update confirmed NFL trades'
          git push
